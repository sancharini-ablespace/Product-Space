<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"></helmet>
<div style="display:flex;gap:22px;border-bottom:1px solid var(--border);font-family:var(--font-sans)">
  <sc-for list="{{ items }}" as="tb" hint-placeholder-count="4">
    <button onClick="{{ tb.go }}" style="border:0;background:transparent;padding:8px 0;margin-bottom:-1px;border-bottom:2px solid {{ tb.border }};color:{{ tb.color }};font-size:var(--fs-lg);font-weight:500;cursor:pointer;display:flex;gap:6px;align-items:center" style-hover="color:var(--ink)">{{ tb.label }}<span style="font-size:var(--fs-sm);color:var(--fainter)">{{ tb.count }}</span></button>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:50},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{label:string,count?:string|number,active?:boolean,go?:()=&gt;void}&gt;&quot;}}">
class Component extends DCLogic {
  state={local:0};
  renderVals(){
    const items=this.props.items||[{label:'Overview'},{label:'Versions',count:2},{label:'Features',count:5},{label:'Activity'}];
    const hasActive=items.some(t=>t.active);
    return {items:items.map((t,i)=>{const a=hasActive?!!t.active:i===this.state.local;return {label:t.label,count:t.count??'',go:t.go||(()=>this.setState({local:i})),border:a?'var(--ink)':'transparent',color:a?'var(--ink)':'var(--muted)'}})};
  }
}
</script>
</body>
</html>
