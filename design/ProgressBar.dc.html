<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"></helmet>
<div style="display:flex;align-items:center;gap:8px;min-width:0;font-family:var(--font-sans)"><div style="flex:1;max-width:{{ max }};height:4px;border-radius:2px;background:#ebeae6;overflow:hidden"><div style="height:100%;width:{{ value }};background:var(--ink-2)"></div></div><span style="font-size:var(--fs-sm);color:var(--ink-3);font-variant-numeric:tabular-nums">{{ label }}</span></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:30},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;50%&quot;,&quot;tsType&quot;:&quot;string|number&quot;},&quot;maxWidth&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:96,&quot;tsType&quot;:&quot;number&quot;},&quot;hideLabel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals(){
    let v=this.props.value??'50%';if(typeof v==='number')v=v+'%';
    return {value:v,label:this.props.hideLabel?'':v,max:(this.props.maxWidth??96)+'px'};
  }
}
</script>
</body>
</html>
