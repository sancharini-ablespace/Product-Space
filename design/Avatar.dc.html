<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"></helmet>
<span title="{{ title }}" style="width:{{ px }};height:{{ px }};border-radius:{{ radius }};background:{{ bg }};color:{{ fg }};border:{{ ring }};margin-left:{{ ml }};display:inline-flex;align-items:center;justify-content:center;font-size:{{ fs }};font-weight:600;flex-shrink:0;font-family:var(--font-sans)">{{ initial }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:60,&quot;height&quot;:40},&quot;av&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;i&quot;:&quot;S&quot;,&quot;bg&quot;:&quot;oklch(0.92 0.04 200)&quot;,&quot;fg&quot;:&quot;oklch(0.42 0.09 200)&quot;},&quot;tsType&quot;:&quot;{i:string,bg:string,fg:string,name?:string}&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:14,&quot;max&quot;:64,&quot;tsType&quot;:&quot;number&quot;},&quot;ring&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;overlap&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const p=this.props,a=p.av||{},size=+(p.size??20);
    return {initial:a.i||'',bg:a.bg||'var(--hover)',fg:a.fg||'var(--faint)',title:p.title||a.name||'',px:size+'px',fs:Math.round(size*0.5)+'px',
      radius:p.square?'var(--r-sm)':'50%',ring:p.ring?'2px solid var(--surface)':'0',ml:p.overlap?'-6px':'0'};
  }
}
</script>
</body>
</html>
