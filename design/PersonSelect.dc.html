<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"></helmet>
<span onClick="{{ stop }}" title="{{ av.name }}" style="position:relative;display:inline-flex;align-items:center;justify-content:center;padding:2px;border-radius:50%;flex-shrink:0" style-hover="box-shadow:0 0 0 1px var(--border-strong);background:var(--surface)">
  <dc-import name="Avatar" av="{{ av }}" size="{{ size }}" hint-size="20px,20px"></dc-import>
  <select value="{{ value }}" onChange="{{ onChange }}" title="{{ av.name }}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;appearance:none;-webkit-appearance:none;border:0;font-size:var(--fs-base);font-family:var(--font-sans)"><option value="Sancharini">{{ pn.Sancharini }}</option><option value="Anshul">{{ pn.Anshul }}</option><option value="Priya">{{ pn.Priya }}</option><option value="Rohan">{{ pn.Rohan }}</option><option value="Meera">{{ pn.Meera }}</option><option value="Vikram">{{ pn.Vikram }}</option><option value="Aditi">{{ pn.Aditi }}</option><option value="Karan">{{ pn.Karan }}</option><option value="Nikhil">{{ pn.Nikhil }}</option></select>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:170,&quot;height&quot;:40},&quot;value&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Sancharini&quot;,&quot;Anshul&quot;,&quot;Priya&quot;,&quot;Rohan&quot;,&quot;Meera&quot;,&quot;Vikram&quot;,&quot;Aditi&quot;,&quot;Karan&quot;,&quot;Nikhil&quot;],&quot;default&quot;:&quot;Sancharini&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;names&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string,string&gt;&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;tsType&quot;:&quot;number&quot;},&quot;bold&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:Event)=&gt;void&quot;}}">
const PEOPLE=['Sancharini','Anshul','Priya','Rohan','Meera','Vikram','Aditi','Karan','Nikhil'];
class Component extends DCLogic {
  state={local:null};
  renderVals(){
    const p=this.props,v=p.value??this.state.local??'Sancharini',names=p.names||{};
    const pn={};PEOPLE.forEach(n=>pn[n]=names[n]||n);
    let h=0;for(const c of v)h=(h*31+c.charCodeAt(0))%360;
    return {value:v,pn,onChange:p.onChange||(e=>this.setState({local:e.target.value})),stop:e=>e.stopPropagation(),size:+(p.size??20),weight:p.bold?500:400,
      av:{i:(pn[v]||v)[0].toUpperCase(),bg:`oklch(0.92 0.04 ${h})`,fg:`oklch(0.42 0.09 ${h})`,name:pn[v]}};
  }
}
</script>
</body>
</html>
