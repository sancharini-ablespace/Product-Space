<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"></helmet>
<span onClick="{{ stop }}" style="position:relative;display:inline-flex;align-items:center"><select value="{{ value }}" onChange="{{ onChange }}" style="appearance:none;-webkit-appearance:none;border:1px solid transparent;background:transparent;border-radius:var(--r-sm);padding:2px 20px 2px 6px;font-size:var(--fs-md);font-weight:500;cursor:pointer;outline:none;font-family:var(--font-sans);color:{{ fg }}" style-hover="border-color:var(--border-strong);background:var(--surface)"><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option></select><span style="position:absolute;right:0;top:0;bottom:0;width:20px;pointer-events:none;color:var(--faint)"><svg width="8" height="5" viewBox="0 0 10 6" style="position:absolute;right:7px;top:50%;margin-top:-2.5px;pointer-events:none;color:currentColor"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:100,&quot;height&quot;:36},&quot;value&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;High&quot;,&quot;Medium&quot;,&quot;Low&quot;],&quot;default&quot;:&quot;High&quot;,&quot;tsType&quot;:&quot;'High'|'Medium'|'Low'&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:Event)=&gt;void&quot;}}">
const TONE={High:'red',Medium:'amber',Low:'gray'};
class Component extends DCLogic {
  state={local:null};
  renderVals(){
    const v=this.props.value??this.state.local??'Medium';
    return {value:v,onChange:this.props.onChange||(e=>this.setState({local:e.target.value})),stop:e=>e.stopPropagation(),fg:`var(--tone-${TONE[v]||'gray'}-fg)`};
  }
}
</script>
</body>
</html>
