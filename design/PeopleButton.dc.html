<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"></helmet>
<span onClick="{{ stop }}" style="display:flex;justify-content:{{ justify }};min-width:0">
  <button onClick="{{ onClick }}" title="{{ title }}" style="display:flex;align-items:center;gap:6px;min-width:0;max-width:100%;height:{{ h }};padding:0 6px;margin:{{ margin }};border:1px solid transparent;border-radius:var(--r-sm);background:transparent;cursor:pointer;font-family:var(--font-sans);font-size:var(--fs-base);font-weight:{{ fw }};color:{{ labelColor }}" style-hover="border-color:var(--border-strong);background:var(--surface)">
    <dc-import name="AvatarStack" people="{{ people }}" max="{{ max }}" align="{{ align }}" empty="" hint-size="44px,22px"></dc-import>
    <sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ label }}</span></sc-if>
  </button>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:44},&quot;people&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{i:string,bg:string,fg:string,name:string}[]&quot;},&quot;max&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;labelColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;var(--ink)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bold&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;md&quot;,&quot;sm&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'md'|'sm'&quot;},&quot;align&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;start&quot;,&quot;end&quot;],&quot;default&quot;:&quot;start&quot;,&quot;tsType&quot;:&quot;'start'|'end'&quot;},&quot;edge&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;start&quot;,&quot;end&quot;,&quot;none&quot;],&quot;default&quot;:&quot;start&quot;,&quot;tsType&quot;:&quot;'start'|'end'|'none'&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:Event)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const p=this.props,edge=p.edge||'start',people=p.people||[],label=p.label??(people.length?'':'Add');
    return {people,max:p.max??3,align:p.align||'start',label,hasLabel:!!label,title:p.title||'',onClick:p.onClick,stop:e=>e.stopPropagation(),
      labelColor:p.labelColor||(people.length?'var(--ink)':'var(--fainter)'),fw:p.bold?500:400,h:p.size==='sm'?'26px':'28px',
      justify:edge==='end'?'flex-end':'flex-start',margin:edge==='end'?'0 -6px 0 0':edge==='none'?'0':'0 0 0 -6px'};
  }
}
</script>
</body>
</html>
