<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"></helmet>
<span onClick="{{ stop }}" style="display:flex;justify-content:flex-end"><button onClick="{{ onClick }}" title="More actions" style="width:26px;height:26px;border:0;border-radius:var(--r-sm);background:{{ bg }};color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0" style-hover="background:var(--hover);color:var(--ink)"><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="3" cy="7" r="1.3" fill="currentColor"></circle><circle cx="7" cy="7" r="1.3" fill="currentColor"></circle><circle cx="11" cy="7" r="1.3" fill="currentColor"></circle></svg></button></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:50,&quot;height&quot;:40},&quot;active&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:Event)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals(){return {onClick:this.props.onClick,bg:this.props.active?'var(--hover)':'transparent',stop:e=>e.stopPropagation()}}
}
</script>
</body>
</html>
